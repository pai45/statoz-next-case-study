name: Deploy case study to GitHub Pages
run-name: Case study ${{ github.sha }}
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: case-study-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run setup:demos
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:pages
      - run: npx playwright install --with-deps chromium
      - name: Verify hosted routes and embedded products
        shell: bash
        run: |
          node scripts/serve-pages.mjs > /tmp/case-study-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4420/statoz-next-case-study/version.json > /dev/null; then break; fi
            sleep 1
          done
          npm run test:pages
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: case-study-browser-diagnostics
          path: test-results/pages
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified case study
        id: deployment
        uses: actions/deploy-pages@v4
